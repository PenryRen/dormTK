version: "3.9"

services:
  dormtk-dev:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: dormTK-dev
    volumes:
      - ../../:/app
      - ../../.cargo_cache/registry:/usr/local/cargo/registry
      - ../../.cargo_cache/git:/usr/local/cargo/git
    environment:
      - CARGO_HOME=/usr/local/cargo
    ports:
      - "8080:8080"
    tty: true
    stdin_open: true

  db:
    image: postgres:15
    container_name: postgres-dev
    environment:
      POSTGRES_USER: dormtk
      POSTGRES_PASSWORD: dormtk
      POSTGRES_DB: dormtk
    ports:
      - "5432:5432"
    volumes:
      - ./PostgreSQL/data:/var/lib/postgresql/data
