version: "3.9"

services:
  dormtk-dev:
    build:
      context: ./dev
      dockerfile: containerfile
    container_name: dormTK-dev
    volumes:
      - .././app:/app
      - ../.cargo_cache/registry:/usr/local/cargo/registry
      - ../.cargo_cache/git:/usr/local/cargo/git
    environment:
      - CARGO_HOME=/usr/local/cargo
    ports:
      - "8080:8080"
    tty: true
    stdin_open: true