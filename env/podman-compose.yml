version: "3.9"

services:
  dormtk-dev:
    build:
      context: ./dev
      dockerfile: containerfile
    container_name: dormTK-dev
    volumes:
      - .././app:/app
      - ../.cargo_cache/registry:/usr/local/cargo/registry
      - ../.cargo_cache/git:/usr/local/cargo/git
    environment:
      - CARGO_HOME=/usr/local/cargo
    ports:
      - "8080:8080"
    tty: true
    stdin_open: true

  db:
    image: postgres:15
    container_name: postgres-dev
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: devdb
    ports:
      - "5432:5432"  # PostgreSQL 默认端口
    volumes:
      - pgdata:/var/lib/postgresql/data  # 持久化数据

volumes:
  pgdata: