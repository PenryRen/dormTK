version: "3.9"

services:
  dormtk-prod:
    build:
      context: ./rust
      dockerfile: containerfile
    container_name: dormTK-prod
    ports:
      - "8080:8080"

  db:
    image: postgres:15
    container_name: postgres-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./PostgreSQL/init.sql:/docker-entrypoint-initdb.d:ro

volumes:
  - pgdata