  /api/admin/permissions:
    get:
      tags: [Admin Auth]
      summary: List permissions
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Permission page
          content:
            application/json:
              schema:
