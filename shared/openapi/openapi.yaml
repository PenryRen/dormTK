components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
    RoomId:
      name: room_id
      in: path
      required: true
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
  requestBodies:
    StudentUpsertBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/StudentUpsert"
    ClassGroupUpsertBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ClassGroupUpsert"
    BuildingUpsertBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/BuildingUpsert"
    RoomUpsertBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoomUpsert"
    InspectionAbnormalBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InspectionAbnormalRequest"
    ReviewBody:
      required: false
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ReviewRequest"
    FileUploadBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: "#/components/schemas/FileUploadRequest"
    FileRelationBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/FileRelationRequest"
    UserCreateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserCreate"
    UserUpdateBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/UserUpdate"
    RoleUpsertBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoleUpsert"
    PermissionUpsertBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PermissionUpsert"
    RoleIdsBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RoleIdsRequest"
    PermissionIdsBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PermissionIdsRequest"
  schemas:
    ApiResponse:
      type: object
      required: [data]
      properties:
        data: true
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    PageMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page:
          type: integer
        page_size:
          type: integer
        total:
          type: integer
          format: int64

    UserStatus:
      type: string
      enum: [active, disabled]
    StudentDutyType:
      type: string
      enum: [class_monitor, inspection_executor, hygiene_executor]
    DutyScopeType:
      type: string
      enum: [room, class, building, task]
    DutyAssignmentStatus:
      type: string
      enum: [active, disabled]
    TeacherClassAssignmentType:
      type: string
      enum: [counselor, teacher, temporary_manager]
    TeacherClassAssignmentStatus:
      type: string
      enum: [active, disabled]
    StudentStatus:
      type: string
      enum: [active, suspended, graduated, left]
    Gender:
      type: string
      enum: [male, female]
    BuildingGenderPolicy:
      type: string
      enum: [male_only, female_only, mixed]
    DormRoomStatus:
      type: string
      enum: [active, disabled]
    AccommodationStatus:
      type: string
      enum: [active, checked_out]
    TaskType:
      type: string
      enum: [inspection, hygiene]
    TaskStatus:
      type: string
      enum: [draft, published, processing, completed, cancelled]
    TaskAssignmentStatus:
      type: string
      enum: [assigned, processing, completed, cancelled]
    AssigneeType:
      type: string
      enum: [teacher, student]
    ScopeType:
      type: string
      enum: [building, floor, room, class, student]
    InspectionMethod:
      type: string
      enum: [manual_abnormal, qr_code]
    InspectionResult:
      type: string
      enum: [present, abnormal, leave, unknown]
    InspectionEvidenceSource:
      type: string
      enum: [check_in, qr_code, manual_abnormal, inspection_room_completed, other_verified]
    InspectionQrTokenStatus:
      type: string
      enum: [active, used, expired, revoked]
    InspectionQrScanResult:
      type: string
      enum: [accepted, rejected]
    InspectionAbnormalAppealType:
      type: string
      enum: [leave, present]
    InspectionAbnormalAppealStatus:
      type: string
      enum: [pending, approved, rejected]
    LeaveSource:
      type: string
      enum: [online, paper, appeal]
    LeaveStatus:
      type: string
      enum: [pending, approved, rejected, withdrawn, cancelled]
    PaperLeaveEvidenceStatus:
      type: string
      enum: [uploaded, verified, rejected, voided]
    CheckInStatus:
      type: string
      enum: [submitted, late, missed, rejected]
    WifiFingerprintStatus:
      type: string
      enum: [active, disabled]
    HygieneScoreTemplateStatus:
      type: string
      enum: [draft, published, disabled]
    HygieneLevel:
      type: string
      enum: [excellent, good, passed, failed]
    FileObjectStatus:
      type: string
      enum: [active, pending_delete, deleted, delete_failed]
    FileRetentionPolicyStatus:
      type: string
      enum: [active, disabled]
    FileCleanupAction:
      type: string
      enum: [physical_delete, archive_then_delete]

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
    LoginUser:
      type: object
      required: [id, username]
      properties:
        id:
          type: string
        username:
          type: string
    LoginResponse:
      type: object
      required: [access_token, user]
      properties:
        access_token:
          type: string
        user:
          $ref: "#/components/schemas/LoginUser"
    LoginResponseEnvelope:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LoginResponse"

    User:
      type: object
      required: [id, username, status, role_ids, roles]
      properties:
        id: { type: string }
        username: { type: string }
        phone: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/UserStatus"
        last_login_at: { type: string, nullable: true }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
        role_ids:
          type: array
          items: { type: string }
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
    UserCreate:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
        phone: { type: string, nullable: true }
        status:
