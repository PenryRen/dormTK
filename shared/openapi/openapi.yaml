openapi: 3.1.0
info:
  title: dormTK API
  version: 0.1.0
  description: dormTK first-stage API contract for backend, Slint admin client, and WeChat mini program.
servers:
  - url: http://localhost:3000
    description: Local development
tags:
  - name: Health
  - name: Admin Auth
  - name: Admin Basics
  - name: Admin Duties
  - name: Admin Inspection
  - name: Admin Check-in
  - name: Admin Hygiene
  - name: Admin Leave
  - name: Admin Files
  - name: Student
  - name: Student Inspection Execution
security:
  - bearerAuth: []
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok

  /api/auth/login:
    post:
      tags: [Admin Auth]
      summary: Admin login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponseEnvelope"

  /api/admin/users:
    get:
      tags: [Admin Auth]
      summary: List users
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: User page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPageResponse"
    post:
      tags: [Admin Auth]
      summary: Create user
      requestBody:
        $ref: "#/components/requestBodies/UserCreateBody"
      responses:
        "200":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/admin/users/{id}:
    get:
      tags: [Admin Auth]
      summary: Get user
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: User detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
    patch:
      tags: [Admin Auth]
      summary: Update user
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/UserUpdateBody"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /api/admin/users/{id}/roles:
    put:
      tags: [Admin Auth]
      summary: Replace user roles
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        $ref: "#/components/requestBodies/RoleIdsBody"
      responses:
        "200":
          description: Updated user roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"

  /api/admin/roles:
    get:
      tags: [Admin Auth]
      summary: List roles
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Role page
          content:
            application/json:
              schema:
